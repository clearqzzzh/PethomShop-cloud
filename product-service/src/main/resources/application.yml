server:
  port: 8082

spring:
  application:
    name: product-service
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: 127.0.0.1:8858
        heart-beat-interval: 5000
        heart-beat-timeout: 15000
        ip-delete-timeout: 30000
      config:
        import-check:
          enabled: false
  datasource:
    url: jdbc:mysql://localhost:3306/pethome_product?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

ai:
  agent:
    url: http://localhost:8001/chat

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:com/kk/pethome/product/mapper/*.xml
