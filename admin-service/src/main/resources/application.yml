server:
  port: 8086

spring:
  application:
    name: admin-service
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: 127.0.0.1:8858
      config:
        import-check:
          enabled: false
  datasource:
    url: jdbc:mysql://localhost:3306/pethome_admin?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      database: 0
      host: 127.0.0.1
      port: 6379
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:com/kk/pethome/**/mapper/*.xml
