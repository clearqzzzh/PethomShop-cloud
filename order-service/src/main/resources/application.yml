server:
  port: 8084

spring:
  application:
    name: order-service
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: 127.0.0.1:8858
      config:
        server-addr: 127.0.0.1:8858
        file-extension: yml
    sentinel:
      transport:
        dashboard: 127.0.0.1:8080
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
      sentinel:
        enabled: true
  datasource:
    url: jdbc:mysql://localhost:3306/pethome_order?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:com/kk/pethome/order/mapper/*.xml
